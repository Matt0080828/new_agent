name: t830 slim agent

on:
  push:
    branches: [t830-only, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: C++ build and tests
        run: cd slim/cpp && make test
      - name: Python tests
        run: cd slim && python3 -m unittest discover -s . -p 'test_*.py'
